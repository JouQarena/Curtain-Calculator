<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="170" y1="100" x2="850" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4055B5"/>
      <stop offset="1" stop-color="#202B62"/>
    </linearGradient>
    <linearGradient id="window" x1="512" y1="315" x2="512" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF1FF"/>
      <stop offset="1" stop-color="#8EC5EE"/>
    </linearGradient>
    <linearGradient id="curtainLeft" x1="255" y1="300" x2="405" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E3F5"/>
    </linearGradient>
    <linearGradient id="curtainRight" x1="769" y1="300" x2="619" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E3F5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#101638" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#background)"/>
  <circle cx="512" cy="492" r="342" fill="#5065C2" opacity="0.42"/>

  <g filter="url(#shadow)">
    <!-- Window behind the curtains -->
    <rect x="384" y="302" width="256" height="390" rx="30" fill="url(#window)"/>
    <path d="M512 310V685M392 498H632" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.82"/>

    <!-- Curtain rod and end caps -->
    <rect x="242" y="235" width="540" height="54" rx="27" fill="#F7C95C"/>
    <circle cx="226" cy="262" r="40" fill="#F7C95C"/>
    <circle cx="798" cy="262" r="40" fill="#F7C95C"/>
    <circle cx="226" cy="262" r="17" fill="#FFF0AD"/>
    <circle cx="798" cy="262" r="17" fill="#FFF0AD"/>

    <!-- Left and right curtain panels -->
    <path d="M276 284C326 275 373 280 408 304C387 411 381 550 411 690C361 727 306 731 246 696C280 563 282 416 276 284Z" fill="url(#curtainLeft)"/>
    <path d="M748 284C698 275 651 280 616 304C637 411 643 550 613 690C663 727 718 731 778 696C744 563 742 416 748 284Z" fill="url(#curtainRight)"/>

    <!-- Soft curtain folds -->
    <path d="M315 300C297 425 304 570 286 687M363 300C339 438 354 573 343 708M709 300C727 425 720 570 738 687M661 300C685 438 670 573 681 708" fill="none" stroke="#B6C5E1" stroke-width="17" stroke-linecap="round" opacity="0.88"/>
    <path d="M287 294C326 309 367 310 401 302M737 294C698 309 657 310 623 302" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Measurement line communicates “calculator” without text -->
  <g fill="none" stroke="#F7C95C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 790H714"/>
    <path d="M310 790L357 754M310 790L357 826M714 790L667 754M714 790L667 826"/>
  </g>
  <circle cx="512" cy="790" r="42" fill="#263574" stroke="#FFF4BF" stroke-width="12"/>
  <path d="M488 778H536M488 802H536" stroke="#FFF4BF" stroke-width="11" stroke-linecap="round"/>
</svg>
